services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-password}
      MYSQL_DATABASE: ${DB_NAME:-tixora}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASS:-password}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override the host-oriented .env value: within the compose network,
      # the database is reachable at the "mysql" service name, not localhost.
      DB_HOST: mysql
      DB_PORT: 3306
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
